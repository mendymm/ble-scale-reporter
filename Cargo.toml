[package]
name = "ble-scale-reporter"
version = "0.1.0"
edition = "2021"
resolver = "2"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.4.2"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[bin]]
name = "ble-scale-reporter"
harness = false

[dependencies]
anyhow = "1"
deku = { version = "0.20.3", default-features = false, features = ["std", "descriptive-errors"] }
esp-idf-svc = { version = "0.52.1", features = ["native"] }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }

[build-dependencies]
embuild = { version = "0.33.3", features = ["espidf"] }

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
